name: Implement Concierge Fix

# Triggers when you add the "approved" label to a "concierge-fix" issue
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number containing the fix document"
        required: true
        type: string

jobs:
  implement:
    # Run on manual dispatch, or when "approved" label is added to a "concierge-fix" issue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'approved' &&
       contains(toJson(github.event.issue.labels), 'concierge-fix'))

    runs-on: ubuntu-latest
    permissions:
      contents: write      # push commits
      issues: write        # comment on and close the issue

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Configure git
        run: |
          git config user.name "Brass Note Concierge Bot"
          git config user.email "bot@brassnotestudios.com"

      - name: Implement fix document
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          PROMPT_TEMPLATE: |
            You are implementing an approved concierge fix document for Brass Note Studios.

            The fix document is at /tmp/fix-document.md — read it now.

            Instructions:
            1. Read /tmp/fix-document.md carefully
            2. For each theme in the document, add the suggested AIML <category> blocks to the correct file in chatbot/aiml/
            3. Do NOT change any existing patterns — only append new ones
            4. Do NOT change any prices or add any subscription content
            5. Follow the file guide in the document (pricing.aiml, commissions.aiml, etc.)
            6. After editing, run: git add chatbot/aiml/ && git commit -m 'feat(concierge): implement fix document from issue #__ISSUE_NUMBER__'
            7. Then run: git push origin HEAD

            Issue title for reference: __ISSUE_TITLE__
        run: |
          # Fetch the issue body from GitHub API
          ISSUE_JSON=$(curl -sf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}")

          ISSUE_TITLE=$(echo "$ISSUE_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['title'])")
          ISSUE_BODY=$(echo "$ISSUE_JSON"  | python3 -c "import json,sys; print(json.load(sys.stdin)['body'])")

          printf '%s' "$ISSUE_BODY" > /tmp/fix-document.md

          # Substitute placeholders and write prompt — no heredoc needed
          printf '%s' "$PROMPT_TEMPLATE" \
            | sed "s/__ISSUE_NUMBER__/${ISSUE_NUMBER}/g" \
            | sed "s/__ISSUE_TITLE__/${ISSUE_TITLE}/g" \
            > /tmp/claude-prompt.txt

          ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" claude --print --allowedTools "Read,Edit,Write,Bash" < /tmp/claude-prompt.txt

      - name: Comment on issue
        if: success()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            if (!issueNumber) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '✅ **Implemented.** The AIML patterns from this fix document have been committed and will be live after the next Vercel deploy (usually ~90 seconds).'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            if (!issueNumber) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '❌ **Implementation failed.** Check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details. The issue remains open — fix the error and re-add the `approved` label to retry.'
            });
